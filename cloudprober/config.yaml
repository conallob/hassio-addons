name: "Cloudprober"
description: "Synthetic probing for Home Assistant and your network, with git-manageable extra config"
version: "0.14.7"
slug: "cloudprober"
init: false
arch:
  - aarch64
  - amd64
icon: true
url: "https://github.com/conallob/hassio-addons/tree/master/cloudprober"
panel_icon: "mdi:radar"
startup: services
ingress: true
ingress_port: 9313
ports:
  9313/tcp: null
  9314/tcp: null
  3141/tcp: null
  3142/tcp: null
ports_description:
  9313/tcp: "Cloudprober status page and Prometheus metrics at /metrics (optional, for direct external access)"
  9314/tcp: "Cloudprober's default gRPC server / API (only listens when grpc_enabled is true; optional, for direct external access)"
  3141/tcp: "Built-in HTTP server (default port; only listens if a `server { type: HTTP }` block is in the config)"
  3142/tcp: "Built-in gRPC probe-target server (default port; only listens if a `server { type: GRPC }` block is in the config)"
map:
  - homeassistant_config:ro
  - share:ro
  - ssl:ro
options:
  log_level: "info"
  grpc_enabled: false
  extra_config_path: ""
  env_vars: []
  cloudprober_config: |
    probe {
      name: "homeassistant"
      type: HTTP
      targets {
        host_names: "homeassistant"
      }
      http_probe {
        protocol: HTTP
        port: 8123
      }
      interval_msec: 30000
      timeout_msec: 5000
    }

    surfacer {
      type: PROMETHEUS
    }
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  grpc_enabled: bool
  extra_config_path: "str?"
  env_vars:
    - name: "match(^[A-Za-z_][A-Za-z0-9_]*$)"
      value: "str"
  cloudprober_config: "str?"
